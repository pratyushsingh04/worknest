# The API runs on a free host that sleeps after 15 idle minutes and takes about a
# minute to wake. This pings it so visitors never hit a cold start.
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 5 --retry-delay 20 --max-time 120 https://worknest-api-ts91.onrender.com/api/health
