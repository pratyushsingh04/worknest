# Render blueprint for the API (Express + Socket.io). The web app deploys to Vercel.
services:
  - type: web
    name: worknest-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npx tsc && npx prisma db push
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: worknest-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://worknest-snowy-five.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: COMPANY_NAME
        sync: false

# Render's free Postgres expires after 30 days. For something permanent, replace
# DATABASE_URL above with a Neon (or other hosted Postgres) connection string.
databases:
  - name: worknest-db
    plan: free
    region: singapore
